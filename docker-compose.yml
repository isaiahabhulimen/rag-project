services:
  rag-api:
    build: .
    container_name: rag-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    volumes:
      - ./database:/app/database

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s